[project]
name = "hexlet-code"
version = "0.1.0"
description = "Page Analyzer Flask Web Application"
authors = [
    { name = "Raf" }
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flask",
    "psycopg2-binary",
    "python-dotenv",
    "validators",
    "requests",
    "beautifulsoup4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["page_analyzer"]

[dependency-groups]
dev = [
    "ruff",
]


